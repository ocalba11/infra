name: validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  nginx-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe de la config nginx
        run: |
          docker run --rm \
            -v "$PWD/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t